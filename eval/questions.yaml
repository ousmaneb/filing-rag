# GROUND TRUTH MUST BE HAND-WRITTEN FROM THE FILINGS.
#
# Every answerable question below ships with `answer: null` and no evidence. Before the
# eval can run, a person has to open the filing, write the answer, and copy one or more
# short exact quotes that support it into `evidence`. The loader refuses to run until
# that is done.
#
# Do not fill these in with an LLM. An eval set labelled by a model measures agreement
# with that model, not correctness.
#
# evidence entries look like:
#   - {doc_id: NVDA_FY2025, quote: "Data Center revenue for fiscal year 2025 was"}
# doc_ids are listed in data/manifest.json. Quotes are matched after lowercasing and
# stripping punctuation, "$" and table pipes, so copy them from the rendered filing.
#
# Unanswerable questions need no answer or evidence. The system is right when it refuses.

# Gold answers extracted from the filings listed in the corpus map.
# evidence format: doc_id + section + verbatim quote (whitespace-normalized from
# BeautifulSoup get_text on the EDGAR primary document).

- id: q01
  type: exact_lookup
  question: What was NVIDIA's Data Center segment revenue in fiscal 2025?
  answer: "$115,186 million, up 142% from $47,525 million in fiscal 2024."
  evidence:
    - doc_id: NVDA_FY2025
      section: "Notes to Consolidated Financial Statements — revenue by specialized markets"
      quote: "Data Center $ 115,186 $ 47,525 $ 15,005"
    - doc_id: NVDA_FY2025
      section: "Item 7, MD&A"
      quote: "Data Center revenue for fiscal year 2025 was up 142% from a year ago."
  note: >
    Data Center is an end-market line, not a reportable segment. NVIDIA's reportable
    segments are Compute & Networking and Graphics. The question's wording is loose;
    accept 115,186 but note the distinction if scoring segment-level retrieval.

