- id: q03
  type: exact_lookup
  question: What was JPMorgan Chase's CET1 capital ratio at the end of 2025?
  answer: >
    14.6% under the Standardized approach and 14.1% under the Advanced approach at
    December 31, 2025, against an 11.5% requirement. Down from 15.7%/15.8% in 2024.
  evidence:
    - doc_id: JPM_FY2025
      section: "Capital Risk Management — Selected capital and RWA data"
      quote: "CET1 capital ratio 14.6 % (c) 15.7 % 11.5 % 14.1 % (c) 15.8 % 11.5 %"
    - doc_id: JPM_FY2025
