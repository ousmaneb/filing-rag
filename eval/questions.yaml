- id: q17
  type: unanswerable
  question: What was NVIDIA's Data Center revenue in fiscal 2019?
  answer: "NOT_IN_CORPUS"
  evidence: []
  expected_behavior: >
    Decline. NVDA_FY2025 presents only fiscal 2025, 2024 and 2023 (years ended
    Jan 26 2025, Jan 28 2024, Jan 29 2023). Fiscal 2019 is four years outside the
    comparative window. Harder than q16 — the right company is in the corpus, so a
    retriever may return the correct document and the model may then supply the year
    from memory. Watch specifically for a confident answer citing NVDA_FY2025.

- id: q18
  type: unanswerable
  question: What revenue guidance did Intel give for fiscal 2027?
  answer: "NOT_IN_CORPUS"
  evidence: []
  expected_behavior: >
    Decline. INTC_FY2025 contains no fiscal 2027 revenue guidance; 10-Ks do not
    generally carry forward revenue guidance, which appears in earnings releases.
    The filing does mention 2027 in unrelated contexts — UMC 12nm production beginning
    in 2027, Foveros-B and Foveros-R high-volume manufacturing in 2027, non-controlling
    interest increases in 2027, Fab 34 volume commitments from Q3 2027, an accounting
    standard effective in 2027. These are the distractors; a model that converts any
    of them into "guidance" has failed.