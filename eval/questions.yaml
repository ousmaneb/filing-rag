- id: q13
  type: qualitative
  question: What risks does AMD describe from its reliance on TSMC for manufacturing?
  answer: >
    AMD describes four linked risks. First, single-source concentration: it relies on
    TSMC for all wafers for microprocessor and GPU products at 7nm or smaller, and
    TSMC manufactures its newest IC products. Second, supply shortfall — if TSMC cannot
    produce sufficient quantities to meet customer demand, AMD may have to ration
    supply among customers, damaging those relationships, and could lose sales; the
    filing says this could have a material adverse effect. Third, process-transition
    and yield risk: AMD's 7nm-and-below roadmap is focused on TSMC's processes, and
    TSMC must successfully transition to advanced nodes and larger wafer sizes at
    acceptable yields and on time, or AMD faces delivery delays and competitive
    disadvantage if rivals transition first. Fourth, geographic concentration in
    Taiwan — the filing names both China-Taiwan geopolitical tension and natural
    disaster, citing the April 2024 Taiwan earthquake near its foundries.
  evidence:
    - doc_id: AMD_FY2025
      section: "Item 1A, Risk Factors — manufacturing"
      quote: >
        We rely on Taiwan Semiconductor Manufacturing Company Limited (TSMC) for the
        production of all wafers for microprocessor and GPU products at 7 nanometer
        (nm) or smaller nodes
    - doc_id: AMD_FY2025
      section: "Item 1A, Risk Factors — manufacturing"
      quote: >
        If we experience supply constraints from our third-party manufacturing
        suppliers, we may be required to allocate the reduced quantities of affected
        products amongst our customers
    - doc_id: AMD_FY2025
      section: "Item 1A, Risk Factors — yields and process technology"
      quote: >
        we are presently focusing our 7 nm and lower product microprocessor and GPU
        portfolio on TSMC's processes
    - doc_id: AMD_FY2025
      section: "Item 1A, Risk Factors — international operations"
      quote: >
        geopolitical changes between China and Taiwan could disrupt the operations of
        our Taiwan-based third-party wafer foundries
    - doc_id: AMD_FY2025
      section: "Item 1A, Risk Factors — natural disasters"
      quote: >
        In April 2024, Taiwan experienced an earthquake where our third-party wafer
        foundries are located.
  note: >
    The TSMC risk is spread across at least four separate risk factors, not
    consolidated in one. A chunk-level retriever that returns only the first will
    produce a partial answer that reads complete. Good discrimination item.

- id: q14
  type: qualitative
  question: How does Costco describe the role of membership fees in its business model?
  answer: >
    Costco frames membership as structurally central rather than as a revenue line.
    The business concept is low prices on a limited selection at high volume and rapid
    turnover, which lets it operate profitably at significantly lower gross margins
    than most retailers — membership fees are what make that low-margin merchandising
    viable. The filing calls membership loyalty and growth essential, and says growth
    in the member base, Executive-membership penetration, and renewal rates materially
    influence profitability. The membership format also serves an operational purpose:
    controlled entrances and exits keep shrinkage well below typical retail. Fees are
    also a primary source of operating cash flow. In fiscal 2025 membership fee revenue
    was $5,323 million, up 10%, with renewal rates of 92.3% in the US and Canada and
    89.8% worldwide, and Executive members accounted for about 73.6% of worldwide net
    sales.
  evidence:
    - doc_id: COST_FY2025
      section: "Item 1, Business"
      quote: >
        these volumes and turnover enable us to operate profitably at significantly
        lower gross margins (net sales less merchandise costs) than most other retailers
    - doc_id: COST_FY2025
      section: "Item 1A, Risk Factors"
      quote: >
        Membership loyalty and growth are essential to our business. The extent to which
        we achieve growth in our membership base, increase the penetration of Executive
        membership, and sustain high renewal rates materially influences our profitability.
    - doc_id: COST_FY2025
      section: "Item 1, Business"
      quote: >
        By strictly controlling the entrances and exits and using a membership format,
        we believe our inventory losses (shrinkage) are well below those of typical
        retail operations.
    - doc_id: COST_FY2025
      section: "Item 7, Membership Fees"
      quote: "Membership fees $ 5,323 $ 4,828 $ 4,580"
    - doc_id: COST_FY2025
      section: "Item 7, Liquidity and Capital Resources"
      quote: "Our cash flow provided by operations is primarily from net sales and membership fees."
  note: >
    Spans Item 1, Item 1A and Item 7. The conceptual claim (low fees subsidize low
    margins) and the quantitative one ($5,323 million) live in different sections.

- id: q15
  type: qualitative
  question: How does Bank of America describe board oversight of cybersecurity risk?
  answer: >
    The Board is described as actively engaged in oversight of the Global Information
    Security (GIS) Program, and is said to include members with technology and
    cybersecurity experience; it oversees management's approach to staffing and to the
    policies and procedures addressing cybersecurity risk. The Board and its Enterprise
    Risk Committee, which is responsible for reviewing cybersecurity risk, each receive
    regular presentations, memoranda and reports from the Chief Technology and
    Information Officer and the Chief Information Security Officer on internal and
    external developments, threats and risks. The Board receives prompt notice of
    incidents that may pose significant risk — including incidents at third-party
    service providers — and continuing reports until resolution, plus quarterly reports
    on GIS performance metrics and cybersecurity risk appetite metrics, and immediate
    notification if a Board-level cybersecurity risk limit is breached. The ERC
    annually reviews and approves the GIS Program and the Information Security Policy.
    This sits within a three-lines-of-defense structure (GIS, Global Compliance and
    Operational Risk, Corporate Audit) with escalation to executive management, Board
    committees, or the Board as appropriate.
  evidence:
    - doc_id: BAC_FY2025
      section: "MD&A, Compliance and Operational Risk Management — Cybersecurity, Governance"
      quote: >
        The Board is actively engaged in the oversight of the GIS Program and devotes
        time and attention to the oversight and mitigation of cybersecurity risk.
    - doc_id: BAC_FY2025
      section: "MD&A, Cybersecurity — Governance"
      quote: >
        The Board and its ERC, which is responsible for reviewing cybersecurity risk,
        each receive regular presentations, memoranda and reports
    - doc_id: BAC_FY2025
      section: "MD&A, Cybersecurity — Governance"
      quote: >
        the Board receives quarterly reports on the performance metrics for the GIS
        Program and the performance of the Corporation's cybersecurity risk appetite
        metrics
    - doc_id: BAC_FY2025
      section: "MD&A, Cybersecurity — Governance"
      quote: >
        Our ERC also annually reviews and approves our GIS Program and our Information
        Security Policy
  note: >
    Retrieval trap worth keeping. Item 1C contains no substance — it is a single
    cross-reference sentence to the MD&A. A retriever that lands on the Item 1C heading
    and stops returns nothing usable. Your corpus map pointed at Item 1C; the content
    is roughly 7,000 lines away in extracted text.

# Apple is outside the corpus. A model knows this from pretraining; retrieval has nothing
# on it. Answering anyway means the system has stopped being a retrieval system.
- id: q16
  type: unanswerable
  question: What was Apple's iPhone revenue in fiscal 2025?
  answer: "NOT_IN_CORPUS"
  evidence: []
  expected_behavior: >
    Decline and state that no Apple filing is in the corpus. Any dollar figure is a
