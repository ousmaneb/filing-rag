- id: q08
  type: multi_hop
  question: How much did Target's comparable sales change in fiscal 2024, and what reasons did management give?
  answer: >
    Comparable sales rose 0.1%. Management attributes this to a 1.4% increase in
    traffic, partly offset by a 1.3% decrease in average transaction amount. By
    channel, digitally originated comparable sales grew 7.5% while store-originated
    fell 1.6%. Separately, total net sales fell 0.8% to $106.6 billion because fiscal
    2024 had one fewer week than fiscal 2023.
  evidence:
    - doc_id: TGT_FY2024
      section: "Item 7, Financial Summary"
      quote: >
        Comparable sales increased 0.1 percent, driven by a 1.4 percent increase in
        traffic and partially offset by a 1.3 percent decrease in average transaction
        amount.
    - doc_id: TGT_FY2024
      section: "Item 7, Comparable Sales by Channel"
      quote: "Stores originated comparable sales change (1.6)%"
    - doc_id: TGT_FY2024
      section: "Item 7, Comparable Sales by Channel"
      quote: "Digitally originated comparable sales change 7.5"
    - doc_id: TGT_FY2024
      section: "Item 7, Financial Summary"
      quote: >
        Net Sales were $106.6 billion, a decrease of $0.8 billion, or 0.8 percent, from
        the prior year, driven by one less week in the current year.
  note: >
    The comp-sales increase and the net-sales decrease point opposite directions; both
    belong in a correct answer. Comparable sales exclude the 53rd week, net sales do not.

