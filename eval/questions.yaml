- id: q04
  type: comparison
  question: Compare Home Depot's and Lowe's net sales in fiscal 2024.
  answer: >
    Home Depot $159,514 million (up 4.5%, +$6.8 billion); Lowe's $83,674 million
    (down 3.1%). Home Depot was roughly 1.9x Lowe's. Fiscal years are not
    equivalent: HD fiscal 2024 had 53 weeks, Lowe's had 52.
  evidence:
    - doc_id: HD_FY2024
      section: "Item 7, Results of Operations"
      quote: "Net sales for fiscal 2024 increased $6.8 billion, or 4.5%, to $159.5 billion."
    - doc_id: HD_FY2024
      section: "Item 7, results table"
      quote: "Net sales $ 159,514 $ 152,669 $ 157,403"
    - doc_id: LOW_FY2024
      section: "Item 7, Results of Operations"
      quote: "Net sales decreased 3.1% to $83.7 billion in fiscal 2024."
    - doc_id: HD_FY2024
      section: "Item 7"
      quote: "Fiscal 2024 consisted of 53 weeks compared to 52 weeks in fiscal 2023."
    - doc_id: LOW_FY2024
      section: "Item 7"
      quote: "The fiscal years ended January 31, 2025 and February 2, 2024 had 52 weeks."
  note: >
    The week-count mismatch is the substantive part of this comparison. HD attributes
    ~$2.5 billion of its increase to the extra week and $6.4 billion to the SRS
    acquisition, so organic HD growth was negative. An answer giving only the two
    totals is retrieval-correct but analytically incomplete.

- id: q05
  type: comparison
  question: Which had the higher gross margin in fiscal 2025, AMD or Intel?
  answer: "AMD, at 50% versus Intel's 34.8%."
  evidence:
    - doc_id: AMD_FY2025
      section: "Item 7, MD&A"
      quote: >
        Gross margin of 50% increased by 1% compared to 49% in 2024, primarily due to
        product mix
    - doc_id: INTC_FY2025
      section: "MD&A, consolidated results of operations table"
      quote: "Gross profit 18,375 34.8 % 17,345 32.7 % 21,711 40.0 %"
  note: >
    Both are GAAP. AMD's 50% is after roughly $440 million of MI308 export-control
    inventory charges; Intel's 34.8% is after $950 million of impairment and
    accelerated depreciation. Intel's own gross-margin percentage appears only in a
    chart image in the Gross Profit subsection — the number above comes from the
    percent-of-revenue column of the results table, which is the only place it exists
    as text. Worth knowing if your extractor drops images.

