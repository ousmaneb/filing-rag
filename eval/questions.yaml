  type: multi_hop
  question: What was Goldman Sachs's return on average common shareholders' equity in 2025, and how did it compare with the firm's stated target?
  answer: >
    ROE was 15.0% for 2025, up from 12.7% in 2024. The firm's stated through-the-cycle
    target is 14% to 16%, so 2025 landed mid-range — inside the target, unlike 2024.
  evidence:
    - doc_id: GS_FY2025
      section: "Item 7, Executive Overview"
      quote: "ROE was 15.0% for 2025, compared with 12.7% for 2024."
    - doc_id: GS_FY2025
      section: "Item 7"
      quote: >
        Our target (through-the-cycle) is to achieve ROE within a range of 14% to 16%
