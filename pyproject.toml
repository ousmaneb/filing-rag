[build-system]
requires = ["setuptools>=84.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secrag"
version = "0.1.0"
requires-python = ">=3.11"
# Base deps stay light: CI installs only these plus [dev], with no torch and no network.
dependencies = [
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=6.0.1",
    "tokenizers>=0.23.2",
    "qdrant-client>=1.19.0",
    "anthropic>=1.5.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]
dev = ["pytest>=9.1.1", "ruff>=0.16.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt text reads better unwrapped.
"src/secrag/generate.py" = ["E501"]
"src/secrag/eval/metrics.py" = ["E501"]
